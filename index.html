<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geovisor de Medellin</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <!-- Panel de capas (izquierda) -->
  <aside id="panel">
    <header>
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2 3 7l9 5 9-5-9-5Zm-9 10 9 5 9-5M3 17l9 5 9-5"/></svg></div>
      <div class="ttl"><span class="brand-kicker">ATLAS URBANO · COLOMBIA</span><b>Medell&#237;n</b><span>Explora el territorio</span></div>
      <button id="themeToggle" class="icon-btn theme-toggle" type="button" title="Cambiar a tema oscuro" aria-label="Cambiar a tema oscuro" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"/></svg></button>
      <button id="panelToggle" class="icon-btn" title="Contraer / expandir"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </header>
    <div id="panelBody">
      <h4>Mapa base</h4>
      <div id="basemaps" class="chips"></div>
      <section id="timeline" aria-label="Línea del tiempo del espacio público">
        <div class="timeline-heading"><div><span class="timeline-kicker">ANÁLISIS HISTÓRICO</span><h3>Espacio público</h3></div><span class="timeline-range">2006 — 2024</span></div>
        <div class="timeline-stepper">
          <button id="periodPrev" class="period-arrow" type="button" aria-label="Periodo anterior" title="Periodo anterior">‹</button>
          <div class="period-current"><strong id="periodCurrent">2024</strong><span id="periodStatus">Activa capas abajo</span></div>
          <button id="periodNext" class="period-arrow" type="button" aria-label="Periodo siguiente" title="Periodo siguiente">›</button>
        </div>
        <div id="periodOptions" class="period-options" role="group" aria-label="Seleccionar año">
          <button type="button" data-period="2006" aria-pressed="false">2006</button>
          <button type="button" data-period="2014" aria-pressed="false">2014</button>
          <button type="button" data-period="2024" aria-pressed="true">2024</button>
        </div>
        <div class="timeline-track" aria-hidden="true"><span id="timelineProgress"></span><i data-year="2006"></i><i data-year="2014"></i><i data-year="2024"></i></div>
      </section>
      <h4>Capas e imágenes <span id="count"></span></h4>
      <ul id="layerList"></ul>
      <section id="tools" aria-labelledby="toolsTitle">
        <h4 id="toolsTitle" class="tools-title">Herramientas</h4>
        <div id="toolsMenu">
          <h4>Dibujar</h4>
          <div class="grid">
            <button data-tool="point"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>Punto</button>
            <button data-tool="line"><svg viewBox="0 0 24 24"><path d="M4 19 10 9l5 6 5-10"/><circle cx="4" cy="19" r="1.5"/><circle cx="20" cy="5" r="1.5"/></svg>L&#237;nea</button>
            <button data-tool="polygon"><svg viewBox="0 0 24 24"><path d="m12 3 8.5 6.5-3.2 10.5H6.7L3.5 9.5 12 3Z"/></svg>Pol&#237;gono</button>
          </div>
          <h4>Medir</h4>
          <div class="grid two">
            <button data-tool="dist"><svg viewBox="0 0 24 24"><path d="m3 17 14-14 4 4L7 21Zm4-4 2 2m1-5 2 2m1-5 2 2"/></svg>Distancia</button>
            <button data-tool="area"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4Z"/><path d="M4 9h4m-4 4h4m4-8v4m4-4v4"/></svg>&#193;rea</button>
          </div>
          <button id="streetViewBtn" class="street-view-control" type="button" aria-pressed="false" title="Abrir Street View en el centro del mapa">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="2.5"/><path d="M7.5 18c.8-2.2 2.3-3.3 4.5-3.3s3.7 1.1 4.5 3.3"/></svg>
            <span>Street View</span>
          </button>
          <button id="dashboardBtn" class="dashboard-launch" type="button" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10m6-10v10"/></svg>
            <span>Dashboard</span>
          </button>
          <button id="clearBtn" class="ghost"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Borrar dibujos</button>
        </div>
      </section>
    </div>
  </aside>

  <aside id="streetViewPanel" class="street-view-panel" aria-label="Google Street View" aria-hidden="true">
    <header class="street-view-header">
      <div><span class="street-view-kicker">VISTA A NIVEL DE CALLE</span><strong>Street View</strong></div>
      <div class="street-view-actions">
        <button id="streetViewCenter" type="button" title="Volver al centro del mapa">Centro del mapa</button>
        <button id="streetViewClose" class="street-view-close" type="button" aria-label="Cerrar Street View" title="Cerrar">&times;</button>
      </div>
    </header>
    <iframe id="streetViewFrame" title="Panorama interactivo de Google Street View" allow="fullscreen" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </aside>

  <section id="dashboard" class="dashboard" role="dialog" aria-modal="true" aria-labelledby="dashboardTitle" aria-hidden="true">
    <div class="dashboard-backdrop" data-dashboard-close></div>
    <div class="dashboard-window">
      <header class="dashboard-header">
        <div><span class="dashboard-kicker">ATLAS URBANO</span><h2 id="dashboardTitle">Tabla de atributos</h2></div>
        <button id="dashboardClose" class="dashboard-close" type="button" aria-label="Cerrar dashboard">&times;</button>
      </header>
      <div class="dashboard-toolbar">
        <label for="dashboardLayer">Capa</label>
        <select id="dashboardLayer"></select>
        <span id="dashboardSummary" class="dashboard-summary"></span>
      </div>
      <div id="dashboardState" class="dashboard-state" aria-live="polite"></div>
      <div class="dashboard-table-wrap">
        <table id="dashboardTable" class="dashboard-table"></table>
      </div>
    </div>
  </section>

  <div id="hint"><span id="hintText"></span><button id="finishBtn">Finalizar</button><button id="cancelBtn" class="ghost">Cancelar</button></div>
  <div id="coords">Lat: -- | Lon: --</div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/shp.js"></script>
  <script src="https://unpkg.com/georaster@1.7.0-0"></script>
  <script src="https://unpkg.com/proj4@2.12.1/dist/proj4.js"></script>
  <script src="https://unpkg.com/georaster-layer-for-leaflet@4.1.2"></script>
  <script src="scripts.js"></script>
</body>
</html>
